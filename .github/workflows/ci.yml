name: Nicotine Teams Linux checks
on:
  workflow_dispatch:
  push:
    branches: [feature/team-profiles]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox libxkbcommon-x11-0 libgl1 libwayland-client0
      - run: cargo fmt --check
      - run: node scripts/test-gnome-model.mjs
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: bash scripts/test-x11.sh
