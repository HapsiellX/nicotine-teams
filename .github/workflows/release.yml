name: Build Linux package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --bin Nicotine
      - name: Package application and GNOME bridge
        shell: bash
        run: |
          mkdir -p package/nicotine-teams/assets package/nicotine-teams/scripts
          cp target/release/Nicotine README.md ROADMAP.md LICENSE package/nicotine-teams/
          cp assets/icon.png package/nicotine-teams/assets/
          cp scripts/install-user.sh scripts/install-gnome-bridge.sh package/nicotine-teams/scripts/
          cp -a gnome-extension package/nicotine-teams/
          tar -C package -czf nicotine-teams-linux-amd64.tar.gz nicotine-teams
      - uses: actions/upload-artifact@v4
        with:
          name: nicotine-teams-linux-amd64
          path: nicotine-teams-linux-amd64.tar.gz
